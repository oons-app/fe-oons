document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ needHair }}\">\n                  <div style=\"display:flex;flex-direction:column;gap:8px\">\n                    <div style=\"font-size:13.5px;font-weight:700\">طول الشعر<\u002Fdiv>\n                    <div style=\"display:flex;gap:8px\">\n                      <sc-for list=\"{{ hairChips }}\" as=\"h\" hint-placeholder-count=\"3\">\n                        <div sc-camel-on-click=\"{{ h.go }}\" style=\"flex:1;border:1px solid #1C1518;background:{{ h.bg }};color:{{ h.fg }};padding:11px;font-size:13px;font-weight:600;text-align:center;cursor:pointer\">{{ h.label }}<\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12px;color:#6E655F\">{{ hairResult }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isEmpty }}\">\n            <div style=\"padding:28px 20px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center\">\n              <div style=\"font-size:14px;font-weight:700\">اختاري خدمة بالـ+ فوق<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#6E655F;line-height:1.6;text-wrap:pretty\">أول ما تختاري، هنسألك بس على اللي الخدمة دي محتاجاه — ولا حاجة زيادة.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"height:22px;flex:0 0 auto\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ══ STEP 2 · WHEN & WHERE ══ -->\n      <sc-if value=\"{{ isStep2 }}\">\n        <div style=\"flex:1;overflow-y:auto;display:flex;flex-direction:column\">\n          <div style=\"padding:18px 20px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid #1C1518\">\n            <div style=\"font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#9A928C\">امتى<\u002Fdiv>\n            <div style=\"display:flex;gap:7px;direction:ltr\">\n              <sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"5\">\n                <div sc-camel-on-click=\"{{ d.go }}\" style=\"flex:1;border:1px solid #1C1518;background:{{ d.bg }};color:{{ d.fg }};padding:9px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer\">\n                  <div style=\"font-size:11px;opacity:.8\">{{ d.dow }}<\u002Fdiv>\n                  <div style=\"font:600 17px 'IBM Plex Mono',monospace\">{{ d.num }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:7px\">\n              <sc-for list=\"{{ times }}\" as=\"t\" hint-placeholder-count=\"6\">\n                <div sc-camel-on-click=\"{{ t.go }}\" style=\"border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }};height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:{{ t.cursor }}\">\n                  <div style=\"font:600 13.5px 'IBM Plex Mono',monospace\">{{ t.label }}<\u002Fdiv>\n                  <div style=\"font-size:9.5px;opacity:.8\">{{ t.note }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:18px 20px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #1C1518\">\n            <div style=\"font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#9A928C\">فين<\u002Fdiv>\n            <sc-for list=\"{{ addrs }}\" as=\"a\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ a.go }}\" style=\"border:1px solid {{ a.border }};background:{{ a.bg }};padding:13px;display:flex;align-items:flex-start;gap:12px;cursor:pointer\">\n                <div style=\"width:17px;height:17px;flex:0 0 auto;margin-top:2px;border:1px solid #1C1518;background:{{ a.dot }}\"><\u002Fdiv>\n                <div style=\"flex:1;display:flex;flex-direction:column;gap:3px\">\n                  <div style=\"font-size:14.5px;font-weight:700\">{{ a.title }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#6E655F;line-height:1.5\">{{ a.line }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font:500 11px 'IBM Plex Mono',monospace;color:#6E655F;white-space:nowrap\">{{ a.travel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"border:1px dashed #9A928C;padding:12px;text-align:center;font-size:13.5px;font-weight:600;color:#3E2136;cursor:pointer\">＋ عنوان جديد<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:18px 20px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #1C1518\">\n            <div style=\"font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#9A928C\">حاجة لازم تعرفها المتخصصة<\u002Fdiv>\n            <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n              <sc-for list=\"{{ noteChips }}\" as=\"n\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ n.go }}\" style=\"border:1px solid #1C1518;background:{{ n.bg }};color:{{ n.fg }};padding:8px 11px;font-size:12.5px;font-weight:600;cursor:pointer\">{{ n.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"border:1px solid #1C1518;background:#FFFFFF;min-height:72px;padding:12px;font-size:13.5px;line-height:1.6;color:{{ notesFg }}\">{{ notesText }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#9A928C\">بتتحفظ لحجوزاتك الجاية · المتخصصة تشوفها قبل الزيارة بساعة<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:18px 20px 28px;display:flex;flex-direction:column;gap:8px\">\n            <div sc-camel-on-click=\"{{ toggleCoupon }}\" style=\"display:flex;align-items:center;justify-content:space-between;cursor:pointer\">\n              <div style=\"font-size:13.5px;font-weight:600;color:#3E2136\">عندك كوبون؟<\u002Fdiv>\n              <div style=\"font:500 14px 'IBM Plex Mono',monospace;color:#6E655F\">{{ couponChev }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ couponOpen }}\">\n              <div style=\"display:flex;gap:8px\">\n                <div style=\"flex:1;border:1px solid #1C1518;background:#FFFFFF;height:46px;display:flex;align-items:center;padding:0 12px;font:500 14px 'IBM Plex Mono',monospace;color:#9A928C\">ONS-CODE<\u002Fdiv>\n                <div style=\"border:1px solid #1C1518;background:#FFFFFF;padding:0 18px;display:flex;align-items:center;font-size:13.5px;font-weight:700;cursor:pointer\">تطبيق<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ══ STEP 3 · PAY ══ -->\n      <sc-if value=\"{{ isStep3 }}\">\n        <div style=\"flex:1;overflow-y:auto;display:flex;flex-direction:column\">\n          <div style=\"padding:18px 20px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid #1C1518\">\n            <div style=\"font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#9A928C\">اللي هيحصل<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ cart }}\" as=\"l\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n                  <div style=\"flex:1;font-size:14px;color:#1C1518;line-height:1.5\">{{ l.label }}<\u002Fdiv>\n                  <div style=\"font:500 13.5px 'IBM Plex Mono',monospace;white-space:nowrap;color:{{ l.fg }}\">{{ l.amount }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;border-top:1px solid #1C1518;padding-top:11px\">\n              <div style=\"display:flex;flex-direction:column;gap:1px\">\n                <div style=\"font-size:15.5px;font-weight:700\">السعر النهائي<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#6E655F\">كل الرسوم داخلة — مفيش أي حاجة بتتزود بعدين<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font:600 21px 'IBM Plex Mono',monospace\">{{ total }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:#4A3F45;background:#EFE9E2;border:1px solid #DCD4CC;padding:9px 11px\">\n              <span>{{ whenWhere }}<\u002Fspan>\n              <span sc-camel-on-click=\"{{ goStep2 }}\" style=\"font-weight:700;color:#3E2136;border-bottom:1px solid #3E2136;cursor:pointer;white-space:nowrap\">تعديل<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:16px 20px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #1C1518\">\n            <div style=\"font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#9A928C\">ادفعي بإيه<\u002Fdiv>\n            <sc-for list=\"{{ methods }}\" as=\"m\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ m.go }}\" style=\"border:1px solid {{ m.border }};background:{{ m.bg }};padding:13px;display:flex;align-items:center;gap:12px;cursor:pointer\">\n                <div style=\"width:17px;height:17px;flex:0 0 auto;border:1px solid #1C1518;background:{{ m.dot }}\"><\u002Fdiv>\n                <div style=\"flex:1;display:flex;flex-direction:column;gap:2px\">\n                  <div style=\"font-size:14.5px;font-weight:700\">{{ m.name }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#6E655F\">{{ m.note }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:0 0 auto;width:44px;height:38px;border:1px solid #1C1518;background:#FFFFFF;display:flex;align-items:center;justify-content:center\">\n                  <sc-if value=\"{{ m.isCard }}\">\n                    <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1C1518\" stroke-width=\"1.6\" stroke-linecap=\"square\">\n                      <rect x=\"2\" y=\"5\" width=\"20\" height=\"14\"><\u002Frect>\n                      <path d=\"M2 9.5h20\"><\u002Fpath>\n                      <path d=\"M5 15h4\"><\u002Fpath>\n                    <\u002Fsvg>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ m.isWallet }}\">\n                    <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1C1518\" stroke-width=\"1.6\" stroke-linecap=\"square\">\n                      <rect x=\"6\" y=\"2\" width=\"12\" height=\"20\"><\u002Frect>\n                      <path d=\"M10 5h4\"><\u002Fpath>\n                      <path d=\"M10.5 18.5h3\"><\u002Fpath>\n                    <\u002Fsvg>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:{{ safetyBg }};color:#F7F4EE;padding:14px 20px;display:flex;align-items:center;gap:11px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px\">⛨<\u002Fspan>\n            <div style=\"flex:1;font-size:13px;line-height:1.55;text-wrap:pretty\">{{ safetyCopy }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div sc-camel-on-click=\"{{ toggleRefund }}\" style=\"padding:14px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-bottom:1px solid #DCD4CC\">\n            <div style=\"font-size:13.5px;font-weight:600\">{{ refundTitle }}<\u002Fdiv>\n            <div style=\"font:500 14px 'IBM Plex Mono',monospace;color:#6E655F\">{{ refundChev }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ refundOpen }}\">\n            <div style=\"padding:4px 20px 18px;display:flex;flex-direction:column\">\n              <sc-for list=\"{{ refundRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #DCD4CC\">\n                  <div style=\"flex:0 0 74px;font:600 12px 'IBM Plex Mono',monospace;color:#3E2136\">{{ r.when }}<\u002Fdiv>\n                  <div style=\"flex:1;font-size:12.5px;line-height:1.55;color:#4A3F45\">{{ r.what }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"height:16px\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ══ PAYING ══ -->\n      <sc-if value=\"{{ isPaying }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px\">\n          <div style=\"width:44px;height:44px;border:2px solid #DCD4CC;border-top-color:#3E2136;border-radius:50%;animation:onsSpin .8s linear infinite\"><\u002Fdiv>\n          <div style=\"font-size:17px;font-weight:700\">بنفتح صفحة الدفع…<\u002Fdiv>\n          <div style=\"font-size:13px;color:#6E655F;text-align:center;line-height:1.6;text-wrap:pretty\">ميعادك محجوز ليكي ١٥ دقيقة. لو الصفحة مافتحتش، هنرجعك هنا بخيارات تانية.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ══ PAYMENT FAILED · recoverable ══ -->\n      <sc-if value=\"{{ isError }}\">\n        <div style=\"flex:1;overflow-y:auto;display:flex;flex-direction:column\">\n          <div style=\"padding:24px 20px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #1C1518\">\n            <div style=\"width:40px;height:40px;border:1px solid #B5654B;background:#F6E7E1;display:flex;align-items:center;justify-content:center;font:600 16px 'IBM Plex Mono',monospace;color:#8E4B36\">!<\u002Fdiv>\n            <div style=\"font-size:26px;font-weight:700;line-height:1.2;text-wrap:pretty\">الدفع مكملش — وميعادك لسه محجوز.<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.65;color:#6E655F;text-wrap:pretty\">{{ failedReason }} مفيش أي مبلغ اتسحب منك. {{ heldSlot }} محجوزة ليكي لـ<b style=\"color:#1C1518\">١٤:٢٢<\u002Fb> كمان.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:16px 20px;display:flex;flex-direction:column;gap:10px\">\n            <div sc-camel-on-click=\"{{ retry }}\" style=\"height:54px;background:#3E2136;color:#F7F4EE;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:16px;font-weight:700;cursor:pointer\">\n              <span>حاولي تاني بنفس الطريقة<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace\">↺<\u002Fspan>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ switchMethod }}\" style=\"height:54px;border:1px solid #1C1518;background:#FFFFFF;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:16px;font-weight:700;cursor:pointer\">\n              <span>جرّبي {{ otherName }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace\">←<\u002Fspan>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ goStep3 }}\" style=\"height:54px;border:1px solid #DCD4CC;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:15px;font-weight:600;color:#4A3F45;cursor:pointer\">\n              <span>ارجعي وغيّري طريقة الدفع<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace\">←<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:6px 20px 24px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:12.5px;line-height:1.6;color:#9A928C;text-wrap:pretty\">الأغلب إن ده من البنك أو الشبكة. لو تكرر، كلّمينا وإحنا نحجزلك بنفسنا.<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;border:1px solid #1C1518;background:#B5654B;color:#F7F4EE;padding:12px 14px;cursor:pointer\">\n              <span style=\"font-family:'IBM Plex Mono',monospace\">✆<\u002Fspan>\n              <span style=\"flex:1;font-size:14px;font-weight:700\">كلّمي الدعم — بيردوا في ٣٠ ثانية<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ══ DONE ══ -->\n      <sc-if value=\"{{ isDone }}\">\n        <div style=\"flex:1;overflow-y:auto;display:flex;flex-direction:column\">\n          <div style=\"background:#6B7355;color:#F7F4EE;padding:20px;display:flex;align-items:center;justify-content:space-between\">\n            <div style=\"font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.14em\">اتدفع · الفلوس واقفة<\u002Fdiv>\n            <div style=\"width:32px;height:32px;border:1px solid #F7F4EE;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace\">✓<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:26px 20px 16px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:30px;font-weight:700;line-height:1.15\">اتحجز. {{ proName }} أكّدت.<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.65;color:#6E655F;text-wrap:pretty\">عندها عنوانك وملاحظتك. هنذكّركم الاتنين قبلها بيوم، وتقدري تكلميها من الحجز في أي وقت.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:0 20px 20px;display:flex;flex-direction:column\">\n            <sc-for list=\"{{ receipt }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #DCD4CC\">\n                <div style=\"font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#9A928C\">{{ r.k }}<\u002Fdiv>\n                <div style=\"font-size:14px;font-weight:600;text-align:left\">{{ r.v }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"padding:0 20px 28px;display:flex;flex-direction:column;gap:9px\">\n            <div style=\"border:1px solid #1C1518;background:#FFFFFF;height:48px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:14.5px;font-weight:700;cursor:pointer\">\n              <span style=\"font-family:'IBM Plex Mono',monospace\">▤<\u002Fspan><span>ضيفيها على تقويمي<\u002Fspan>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ restart }}\" style=\"border:1px solid #DCD4CC;height:48px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#4A3F45;cursor:pointer\">احجزي حجز تاني<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ══ STICKY BAR ══ -->\n      <sc-if value=\"{{ showBar }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:0 0 auto;border-top:1px solid #1C1518;background:#F7F4EE;padding:11px 16px 22px;display:flex;flex-direction:column;gap:8px\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between\">\n            <div style=\"display:flex;flex-direction:column;gap:1px\">\n              <div style=\"font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#9A928C\">{{ barLabel }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#6E655F\">{{ barSub }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font:600 19px 'IBM Plex Mono',monospace\">{{ total }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ next }}\" style=\"height:54px;background:{{ ctaBg }};color:{{ ctaFg }};display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:16.5px;font-weight:700;cursor:{{ ctaCursor }}\">\n            <span>{{ ctaLabel }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace\">←<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:340px;display:flex;flex-direction:column;gap:22px;padding-top:34px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font-size:26px;font-weight:700;line-height:1.2;color:#F7F4EE;text-wrap:pretty\">حجز أبسط: فئة أول، وأسئلة على قد الخدمة<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.7;color:#A79E98;text-wrap:pretty\">الفلو شغّال — اختاري فئة، زوّدي خدمة، وكمّلي للدفع. جرّبي الدفع، فيه حالة فشل قابلة للإنقاذ.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-top:1px solid #3A3034\">\n      <sc-for list=\"{{ changes }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <div style=\"padding:14px 0;border-bottom:1px solid #3A3034;display:flex;flex-direction:column;gap:5px\">\n          <div style=\"font-size:14px;font-weight:700;color:#F7F4EE\">{{ c.t }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:1.6;color:#8E867F;text-wrap:pretty\">{{ c.d }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:840,&quot;height&quot;:980}}\">\nconst AR = s => String(s).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[+d]);\nconst money = n => AR(n.toLocaleString('en-US')) + ' ج.م';\n\nconst CATS = [\n  { id: 'clean', name: 'تنظيف', icon: '✳', meta: '٤ خدمات' },\n  { id: 'beauty', name: 'تجميل', icon: '✂', meta: '٨ خدمات' }\n];\n\nconst SERVICES = {\n  clean: [\n    { id: 'c1', name: 'تنظيف عادي', note: 'غرف وحمامات ومطبخ · مُساعدة واحدة', base: 800,\n      includes: ['كنس ومسح كل الأرضيات', 'الحمامات: الحوض والمرحاض والدش', 'المطبخ من بره · الرخامة والحوض', 'ترتيب السراير وتغيير المفارش', 'الزبالة بتتنزّل'],\n      excludes: ['الشبابيك من بره', 'الدواليب من جوّه'] },\n    { id: 'c2', name: 'تنظيف عميق', note: 'كل اللي في العادي + التفاصيل', base: 1200,\n      includes: ['كل اللي في التنظيف العادي', 'الشبابيك والشيش من جوّه وبره', 'الدواليب من جوّه', 'الفرن والميكرويف والتلاجة من جوّه', 'خلف الأجهزة وتحت السراير', 'إزالة الجير من الحمامات'],\n      excludes: ['غسيل السجاد بالبخار (خدمة لوحدها)'] },\n    { id: 'c3', name: 'المطبخ بس', note: 'حوالي ساعتين', base: 450,\n      includes: ['الرخامة والحوض والصنبور', 'الدواليب من بره', 'الفرن والبوتاجاز', 'الأرضية والزبالة'],\n      excludes: ['باقي البيت'] },\n    { id: 'c4', name: 'بعد فرح أو نقل', note: 'يوم كامل · مُساعدتين', base: 1500,\n      includes: ['البيت كله من أول ما تخشي', 'شيل مخلفات وكراتين', 'مسح الأتربة من الشقف والحيطان', 'الحمامات والمطبخ تنظيف عميق', 'الشبابيك والبلكونات'],\n      excludes: ['نقل الأثاث التقيل'] }\n  ],\n  beauty: [\n    { id: 'b1', name: 'تجفيف وتصفيف', note: 'غسيل ومكواة واستشوار', base: 650, hair: true,\n      includes: ['غسيل بشامبو وبلسم مناسبين لشعرك', 'استشوار وتجفيف', 'مكواة أو تشكيل', 'سيرم حماية من الحرارة'],\n      excludes: ['الصبغة أو البروتين'] },\n    { id: 'b2', name: 'مكياج مناسبة', note: 'مع تثبيت · حوالي ساعة', base: 900,\n      includes: ['تنظيف وتجهيز البشرة', 'كونتور وهاي لايت', 'عيون كاملة + رموش', 'تثبيت يقعد لآخر الليل'],\n      excludes: ['تصفيف الشعر (زوّديه من فوق)'] },\n    { id: 'b3', name: 'شعر عروس', note: 'مع تجربة قبلها', base: 1800, hair: true,\n      includes: ['تجربة كاملة قبل اليوم بأسبوع', 'غسيل وتجهيز يوم الفرح', 'التصفيفة مع تثبيت وطرحة', 'حضور وقت التسليم للتعديل'],\n      excludes: ['المكياج (زوّديه من فوق)'] },\n    { id: 'b4', name: 'حواجب', note: 'تشكيل وصبغة', base: 300,\n      includes: ['تشكيل بالخيط أو الشمع', 'صبغة بلون يناسبك', 'ترطيب بعدها'], excludes: [] },\n    { id: 'b5', name: 'إزالة شعر', note: 'الجسم كامل · سويت أو واكس', base: 1200,\n      includes: ['الجسم كامل: إيدين ورجلين وتحت الإبط', 'سويت طبيعي أو واكس — إنتي تختاري', 'تقشير خفيف قبلها', 'كريم مهدّي بعدها'],\n      excludes: ['الوش (خدمة لوحدها ٢٠٠ ج.م)'] },\n    { id: 'b6', name: 'عناية بالبشرة', note: 'تنظيف بشرة', base: 750,\n      includes: ['تنظيف عميق وتبخير', 'إزالة الرؤوس السودة', 'ماسك على نوع بشرتك', 'ترطيب وواقي شمس'], excludes: [] },\n    { id: 'b7', name: 'بديكير ومانيكير', note: 'مع تقليم وتلميع', base: 400,\n      includes: ['نقع وتقليم وتنظيف', 'إزالة الجلد الميت', 'مساج إيدين ورجلين', 'تلميع أو لون عادي'],\n      excludes: ['الجيل (+١٠٠ ج.م)'] },\n    { id: 'b8', name: 'فيك نيلز', note: 'تركيب وتشكيل', base: 400,\n      includes: ['تجهيز الضوافر', 'تركيب وتشكيل بالطول اللي تحبيه', 'لون أو جيل', 'تثبيت'],\n      excludes: ['الرسم والنقشات (+١٥٠ ج.م)'] }\n  ]\n};\n\nconst AREAS = [\n  { id: 'a1', label: 'أقل من ١٠٠ م²', mult: 0.8, crew: 'مُساعدة واحدة · حوالي ٣ ساعات' },\n  { id: 'a2', label: '١٠٠ – ١٥٠ م²', mult: 1, crew: 'مُساعدة واحدة · حوالي ٤ ساعات' },\n  { id: 'a3', label: '١٥٠ – ٢٥٠ م²', mult: 1.35, crew: 'مُساعدتين · حوالي ٤ ساعات' },\n  { id: 'a4', label: 'أكبر من ٢٥٠ م²', mult: 1.75, crew: 'مُساعدتين · يوم كامل' }\n];\nconst areaFromNumber = m => m <= 0 ? null : m < 100 ? AREAS[0] : m <= 150 ? AREAS[1] : m <= 250 ? AREAS[2] : AREAS[3];\nconst HAIR = [\n  { id: 'h1', label: 'قصير', add: 0 },\n  { id: 'h2', label: 'متوسط', add: 80 },\n  { id: 'h3', label: 'طويل', add: 150 }\n];\nconst NOTE_CHIPS = [\n  { id: 'n1', label: 'مفيش أسانسير' },\n  { id: 'n2', label: 'عندي قطة' },\n  { id: 'n3', label: 'دقّي مرتين' },\n  { id: 'n4', label: 'البواب بيدل' }\n];\nconst ADDRS = [\n  { id: 'ad1', title: 'البيت · المعادي', line: '١٢ شارع ٩، الدور ٣', travel: 60 },\n  { id: 'ad2', title: 'الشغل · وسط البلد', line: '٤ شارع شريف، الدور ٧', travel: 95 }\n];\nconst DAYS = [\n  { id: 'd1', dow: 'خميس', num: '١٧' },\n  { id: 'd2', dow: 'جمعة', num: '١٨' },\n  { id: 'd3', dow: 'سبت', num: '١٩' },\n  { id: 'd4', dow: 'حد', num: '٢٠' },\n  { id: 'd5', dow: 'اتنين', num: '٢١' }\n];\nconst TIMES = [\n  { id: 't1', label: '١١:٠٠ ص', free: true },\n  { id: 't2', label: '١:٠٠ م', free: false },\n  { id: 't3', label: '٣:٠٠ م', free: true },\n  { id: 't4', label: '٥:٠٠ م', free: true },\n  { id: 't5', label: '٧:٠٠ م', free: true },\n  { id: 't6', label: '٩:٠٠ م', free: false }\n];\nconst METHODS = [\n  { id: 'card', name: 'بطاقة', note: 'فيزا · ماستركارد · ميزة · إطار آمن' },\n  { id: 'wallet', name: 'محفظة الموبايل', note: 'فودافون كاش · أورنج · اتصالات · وي' }\n];\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'step1', cat: 'clean', qty: {}, area: 'a2', areaM: '', tools: 'hers',\n    guests: 1, hair: 'h2', open: null,\n    day: 'd2', time: 't3', addr: 'ad1', notes: [], couponOpen: false,\n    method: 'card', refundOpen: false, failed: 'card'\n  };\n\n  pick(k, v) { this.setState({ [k]: v }); }\n  bump(id, d) {\n    this.setState(s => {\n      const q = { ...s.qty }, n = Math.max(0, (q[id] || 0) + d);\n      if (n === 0) delete q[id]; else q[id] = n;\n      return { qty: q, open: d > 0 && n === 1 ? id : s.open };\n    });\n  }\n  areaObj() {\n    const typed = areaFromNumber(parseInt(this.state.areaM, 10) || 0);\n    return typed || AREAS.find(a => a.id === this.state.area) || AREAS[1];\n  }\n\n  lines() {\n    const st = this.state;\n    const area = this.areaObj();\n    const hair = HAIR.find(h => h.id === st.hair) || HAIR[0];\n    const out = [];\n    Object.keys(SERVICES).forEach(cat => {\n      SERVICES[cat].forEach(s => {\n        const q = st.qty[s.id];\n        if (!q) return;\n        let unit = s.base, extra = '';\n        if (cat === 'clean') { unit = Math.round(s.base * area.mult / 10) * 10; extra = area.label; }\n        if (cat === 'beauty' && s.hair && hair.add) { unit = s.base + hair.add; extra = 'شعر ' + hair.label; }\n        const mult = cat === 'clean' ? q : q * st.guests;\n        out.push({\n          id: s.id, cat, name: s.name, extra, qty: q, unit, mult,\n          amount: unit * mult\n        });\n      });\n    });\n    return out;\n  }\n\n  totals() {\n    const st = this.state;\n    const ls = this.lines();\n    const sub = ls.reduce((a, l) => a + l.amount, 0);\n    const addr = ADDRS.find(a => a.id === st.addr) || ADDRS[0];\n    const travel = ls.length ? addr.travel : 0;\n    const tools = st.tools === 'hers' && ls.some(l => l.cat === 'clean') ? 50 : 0;\n    return { ls, sub, travel, tools, total: sub + travel + tools };\n  }\n\n  renderVals() {\n    const st = this.state;\n    const T = this.totals();\n    const cat = st.cat;\n    const picked = T.ls;\n    const area = this.areaObj();\n    const typedArea = areaFromNumber(parseInt(st.areaM, 10) || 0);\n    const hair = HAIR.find(h => h.id === st.hair) || HAIR[0];\n    const addr = ADDRS.find(a => a.id === st.addr) || ADDRS[0];\n    const day = DAYS.find(d => d.id === st.day) || DAYS[1];\n    const time = TIMES.find(t => t.id === st.time) || TIMES[2];\n    const method = METHODS.find(m => m.id === st.method) || METHODS[0];\n    const chip = on => ({ bg: on ? '#3E2136' : '#FFFFFF', fg: on ? '#F7F4EE' : '#1C1518' });\n\n    const catPicked = picked.filter(l => l.cat === cat);\n    const needHair = catPicked.some(l => (SERVICES.beauty.find(s => s.id === l.id) || {}).hair);\n\n    const svcCount = n => AR(n) + (n === 1 ? ' خدمة' : ' خدمات');\n    const slotText = day.dow + ' ' + day.num + ' · ' + time.label;\n\n    const stepIdx = { step1: 0, step2: 1, step3: 2 }[st.screen];\n    const stepLabels = ['١ الخدمة', '٢ الميعاد', '٣ الدفع'];\n    const goto = n => () => this.setState({ screen: 'step' + n });\n\n    const fieldsCopy = {\n      clean: { label: 'تفاصيل التنظيف', hint: 'سؤالين بس — بيحددوا السعر وعدد المُساعدات.' },\n      beauty: { label: 'تفاصيل الجلسة', hint: 'بنسأل على اللي يفرق في الوقت والسعر.' }\n    }[cat];\n\n    const cartLines = picked.map(l => ({\n      label: l.name + (l.mult > 1 ? ' × ' + AR(l.mult) : '') + (l.extra ? ' · ' + l.extra : ''),\n      amount: money(l.amount), fg: '#1C1518'\n    }));\n    if (T.travel) cartLines.push({ label: 'انتقال إلى ' + addr.title.split(' · ')[1], amount: money(T.travel), fg: '#6E655F' });\n    if (T.tools) cartLines.push({ label: 'أدوات ومواد من عندها', amount: money(T.tools), fg: '#6E655F' });\n\n    const ctaReady = picked.length > 0;\n    const bar = {\n      step1: { label: ctaReady ? 'الإجمالي' : 'لسه مفيش خدمة', sub: ctaReady ? svcCount(picked.length) + ' · الرسوم داخلة' : 'اختاري خدمة تبدأي', cta: 'كمّلي للميعاد' },\n      step2: { label: 'الإجمالي', sub: day.dow + ' ' + day.num + ' · ' + time.label, cta: 'كمّلي للدفع' },\n      step3: { label: 'المطلوب دلوقتي', sub: method.name, cta: 'ادفعي ' + money(T.total) }\n    }[st.screen] || {};\n\n    return {\n      inFlow: ['step1', 'step2', 'step3'].includes(st.screen),\n      showBar: ['step1', 'step2', 'step3'].includes(st.screen),\n      isStep1: st.screen === 'step1', isStep2: st.screen === 'step2', isStep3: st.screen === 'step3',\n      isPaying: st.screen === 'paying', isError: st.screen === 'error', isDone: st.screen === 'done',\n      stepTitle: ['حجزك', 'الميعاد والعنوان', 'الدفع'][stepIdx] || '',\n      steps: stepLabels.map((label, i) => ({\n        label, bar: i <= stepIdx ? (i === stepIdx ? '#3E2136' : '#6B7355') : '#DCD4CC',\n        fg: i === stepIdx ? '#3E2136' : i < stepIdx ? '#4E5540' : '#9A928C',\n        weight: i === stepIdx ? 700 : 500,\n        go: i <= stepIdx || ctaReady ? goto(i + 1) : () => {}\n      })),\n\n      cats: CATS.map(c => {\n        const on = c.id === cat;\n        return {\n          ...c,\n          bg: on ? '#3E2136' : '#EFE9E2',\n          fg: on ? '#F7F4EE' : '#7E7570',\n          rule: on ? '#B5654B' : 'transparent',\n          weight: on ? 700 : 500,\n          metaFg: on ? '#D9CBD4' : '#9A928C',\n          go: () => this.pick('cat', c.id)\n        };\n      }),\n      catHeading: { clean: 'تنظيف البيت', beauty: 'كوافير وتجميل' }[cat],\n      catCount: svcCount(SERVICES[cat].length),\n      services: SERVICES[cat].map(s => {\n        const q = st.qty[s.id] || 0;\n        let price = s.base;\n        if (cat === 'clean') price = Math.round(s.base * area.mult / 10) * 10;\n        if (cat === 'beauty' && s.hair) price = s.base + hair.add;\n        const open = st.open === s.id;\n        return {\n          name: s.name, note: s.note, price: AR(price.toLocaleString('en-US')),\n          qty: AR(q), bg: q ? '#F0E6EE' : '#F7F4EE', decFg: q ? '#1C1518' : '#C9C1BA',\n          inc: () => this.bump(s.id, 1), dec: () => this.bump(s.id, -1),\n          open, hasDetails: true,\n          detailsLabel: open ? 'اقفلي التفاصيل' : 'الخدمة دي فيها إيه؟',\n          detailsChev: open ? '−' : '+',\n          toggle: () => this.setState(t => ({ open: t.open === s.id ? null : s.id })),\n          includes: s.includes.map(x => ({ text: x })),\n          excludes: s.excludes.map(x => ({ text: x })),\n          hasExcludes: s.excludes.length > 0\n        };\n      }),\n\n      hasPicked: catPicked.length > 0,\n      isEmpty: picked.length === 0,\n      fieldsLabel: fieldsCopy.label, fieldsHint: fieldsCopy.hint,\n      catIsClean: cat === 'clean', catIsBeauty: cat === 'beauty',\n      needHair,\n\n      areaChips: AREAS.map(a => ({ label: a.label, ...chip(!typedArea && a.id === st.area), go: () => this.setState({ area: a.id, areaM: '' }) })),\n      areaResult: area.crew,\n      areaM: st.areaM,\n      areaType: e => {\n        const v = e.target.value.replace(/[^0-9٠-٩]/g, '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).slice(0, 4);\n        this.setState({ areaM: v });\n      },\n      areaMBorder: typedArea ? '#3E2136' : '#1C1518',\n      areaMBg: typedArea ? '#F0E6EE' : '#FFFFFF',\n      toolChips: [\n        { id: 'hers', label: 'تجيبها معاها' },\n        { id: 'mine', label: 'موجودة عندي' }\n      ].map(t => ({ label: t.label, ...chip(t.id === st.tools), go: () => this.pick('tools', t.id) })),\n      toolResult: st.tools === 'hers' ? '+٥٠ ج.م على الزيارة · كل المواد داخلة' : 'من غير أي زيادة',\n      hairChips: HAIR.map(h => ({ label: h.label, ...chip(h.id === st.hair), go: () => this.pick('hair', h.id) })),\n      hairResult: hair.add ? '+' + AR(hair.add) + ' ج.م على خدمات الشعر' : 'من غير زيادة',\n      guests: AR(st.guests),\n      guestsInc: () => this.setState(s => ({ guests: Math.min(6, s.guests + 1) })),\n      guestsDec: () => this.setState(s => ({ guests: Math.max(1, s.guests - 1) })),\n\n      days: DAYS.map(d => ({ dow: d.dow, num: d.num, bg: d.id === st.day ? '#3E2136' : '#FFFFFF', fg: d.id === st.day ? '#F7F4EE' : '#1C1518', go: () => this.pick('day', d.id) })),\n      times: TIMES.map(t => ({\n        label: t.label, note: t.free ? (t.id === st.time ? 'اخترتيه' : 'متاح') : 'محجوز',\n        bg: !t.free ? '#EDE6E0' : t.id === st.time ? '#3E2136' : '#FFFFFF',\n        fg: !t.free ? '#9A928C' : t.id === st.time ? '#F7F4EE' : '#1C1518',\n        border: t.free ? '#1C1518' : '#DCD4CC', cursor: t.free ? 'pointer' : 'not-allowed',\n        go: t.free ? () => this.pick('time', t.id) : () => {}\n      })),\n      addrs: ADDRS.map(a => ({\n        title: a.title, line: a.line, travel: 'انتقال ' + AR(a.travel),\n        bg: a.id === st.addr ? '#F0E6EE' : '#FFFFFF', border: a.id === st.addr ? '#3E2136' : '#1C1518',\n        dot: a.id === st.addr ? '#3E2136' : '#FFFFFF', go: () => this.pick('addr', a.id)\n      })),\n      noteChips: NOTE_CHIPS.map(n => {\n        const on = st.notes.includes(n.id);\n        return { label: n.label, ...chip(on), go: () => this.setState(s => ({ notes: on ? s.notes.filter(x => x !== n.id) : [...s.notes, n.id] })) };\n      }),\n      notesText: st.notes.length ? NOTE_CHIPS.filter(n => st.notes.includes(n.id)).map(n => n.label).join('. ') + '.' : 'أو اكتبي بنفسك…',\n      notesFg: st.notes.length ? '#1C1518' : '#9A928C',\n      couponOpen: st.couponOpen, couponChev: st.couponOpen ? '−' : '+',\n      toggleCoupon: () => this.setState(s => ({ couponOpen: !s.couponOpen })),\n\n      cart: cartLines,\n      total: money(T.total),\n      whenWhere: day.dow + ' ' + day.num + ' سبتمبر · ' + time.label + ' · ' + addr.title,\n      methods: METHODS.map(m => ({\n        name: m.name, note: m.note, isCard: m.id === 'card', isWallet: m.id === 'wallet',\n        bg: m.id === st.method ? '#F0E6EE' : '#FFFFFF', border: m.id === st.method ? '#3E2136' : '#1C1518',\n        dot: m.id === st.method ? '#3E2136' : '#FFFFFF', go: () => this.pick('method', m.id)\n      })),\n      safetyBg: '#6B7355',\n      safetyCopy: 'فلوسك واقفة عندنا. بتوصلها بعد ما الزيارة تخلص وإنتي تأكدي.',\n      refundTitle: 'إلغاء مجاني لحد ٤٨ ساعة قبل الزيارة',\n      refundOpen: st.refundOpen, refundChev: st.refundOpen ? '−' : '+',\n      toggleRefund: () => this.setState(s => ({ refundOpen: !s.refundOpen })),\n      refundRows: [\n        { when: 'قبل ٤٨ س+', what: 'المبلغ كله يرجع على نفس الطريقة — من ٥ لـ٩ أيام عمل.' },\n        { when: '١٢–٤٨ س', what: 'نص المبلغ يرجع. وقتها كان محجوز ليكي خلاص.' },\n        { when: 'أقل من ١٢ س', what: 'مفيش رجوع — تكون رفضت شغل تاني.' },\n        { when: 'لو هي لغت', what: 'كل المبلغ يرجع + رصيد ١٠٠ ج.م + بديلة في نفس الميعاد.' }\n      ],\n\n      barLabel: bar.label, barSub: bar.sub, ctaLabel: bar.cta,\n      ctaBg: ctaReady ? '#3E2136' : '#DCD4CC', ctaFg: ctaReady ? '#F7F4EE' : '#9A928C',\n      ctaCursor: ctaReady ? 'pointer' : 'not-allowed',\n      next: () => {\n        if (!ctaReady) return;\n        if (st.screen === 'step1') return this.setState({ screen: 'step2' });\n        if (st.screen === 'step2') return this.setState({ screen: 'step3' });\n        this.setState({ screen: 'paying', failed: st.method });\n        setTimeout(() => this.setState(s => ({ screen: s.screen === 'paying' ? 'error' : s.screen })), 1600);\n      },\n      back: () => this.setState(s => ({ screen: s.screen === 'step3' ? 'step2' : 'step1' })),\n      goStep2: goto(2), goStep3: goto(3),\n\n      failedReason: (st.failed === 'wallet' ? 'بوابة الدفع بمحفظة الموبايل' : 'بوابة الدفع بالبطاقة') + ' مردتش علينا.',\n      heldSlot: slotText,\n      otherName: st.method === 'card' ? 'محفظة الموبايل' : 'البطاقة',\n      retry: () => {\n        this.setState({ screen: 'paying' });\n        setTimeout(() => this.setState(s => (s.screen === 'paying' ? { screen: 'done' } : {})), 1500);\n      },\n      switchMethod: () => {\n        const other = st.method === 'card' ? 'wallet' : 'card';\n        this.setState({ method: other, screen: 'paying' });\n        setTimeout(() => this.setState(s => (s.screen === 'paying' ? { screen: 'done' } : {})), 1500);\n      },\n\n      proName: 'نورهان',\n      receipt: [\n        { k: 'المرجع', v: 'ONS-4671-08' },\n        { k: 'الموعد', v: day.dow + ' ' + day.num + ' سبتمبر · ' + time.label },\n        { k: 'المكان', v: addr.title },\n        { k: 'المدفوع', v: money(T.total) + ' · واقفة' }\n      ],\n      restart: () => this.setState({ screen: 'step1', qty: {}, cat: 'clean' }),\n\n      changes: [\n        { t: 'الفئة أول · التنظيف افتراضي', d: 'تابين فوق: تنظيف وتجميل. كل فئة بتوري خدماتها هي بس — مفيش بديكير في نص قائمة التنظيف.' },\n        { t: 'كل خدمة بتفتح وتقول فيها إيه', d: 'أول ما تزوّدي خدمة بتفتح لوحدها: «داخل في السعر» بالتفصيل، و«مش داخل» عشان مفيش مفاجآت يوم الزيارة.' },\n        { t: 'المساحة: شيبس أو رقم بالظبط', d: 'اختاري شريحة جاهزة، أو اكتبي المساحة بالرقم وإحنا نحدد الشريحة وعدد المُساعدات.' },\n        { t: 'الأسئلة على قد الفئة', d: 'المساحة والأدوات للتنظيف. عدد الواحدات وطول الشعر للتجميل — وطول الشعر بيظهر بس لو اخترتي خدمة شعر.' },\n        { t: 'رقم واحد من الأول للآخر', d: 'كانت ٨٠٠ في الشريط و٨٢٤ في الدفع. بقى «السعر النهائي» شامل كل الرسوم، ونفس الرقم على الزر.' },\n        { t: 'ضيوف داخل ضيوف اتشالت', d: 'بدل قسم ضيفة بخدماتها، عدّاد لكل خدمة + «كام واحدة هتاخد الخدمة».' },\n        { t: 'ثلاث خطوات مش تلات صفحات طويلة', d: 'الخدمة · الميعاد والعنوان · الدفع. الميعاد والعنوان والملاحظات كلهم في شاشة واحدة بضغطات.' },\n        { t: 'طريقتين دفع بس، بأيقونات', d: 'بطاقة أو محفظة الموبايل (فودافون كاش وأورنج واتصالات ووي) — إنستاباي والكاش اتشالوا.' },\n        { t: 'فشل الدفع بقى قابل للإنقاذ', d: 'بدل شاشة فاضية فيها «حاولي تاني»: السبب، إن مفيش مبلغ اتسحب، الميعاد محجوز ١٥ دقيقة، وطريقة دفع بديلة أو الدعم.' },\n        { t: 'ملاحظات بضغطة', d: 'شيبس جاهزة (مفيش أسانسير، عندي قطة) بدل كتابة من الصفر في كل حجز.' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
