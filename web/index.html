<!DOCTYPE html><html><head>
  <!-- Warm up the origins the first paint depends on. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin="">
  <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin="">
  <link rel="preconnect" href="https://api.oons.app" crossorigin="">
  <link rel="dns-prefetch" href="https://www.googletagmanager.com">

  <!--
    <base> must come before any relative-URL <script src> below it — a
    plain <a href="/p/slug"> link (the provider landing page's own "Book
    now" button, not a client-side SPA route push) loads this document
    fresh with the browser's URL already at /p/slug. A script tag's src is
    resolved against the document's own URL the moment the parser reaches
    it, base-href or not, if <base> hasn't been parsed yet — so
    consent.js/gtag_boot.js/consent_banner.js all resolved to
    /p/consent.js etc. and failed to load on every such deep link,
    "Refused to execute script ... MIME type ('text/html')" (Caddy's SPA
    fallback serving index.html for the nonexistent path). Harmless on
    lady.oons.app, where every session starts at "/" and everything after
    is client-side routing — this only ever bit a *.oons.app vanity
    subdomain's own booking link.

    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <!-- Start the engine download before consent/gtag so ad traffic is not waiting. -->
  <script src="flutter_bootstrap.js" async=""></script>

  <!-- Consent Mode v2 (Advanced) — must run before Google tag config -->
  <script src="consent.js"></script>
  <!-- Google tag (gtag.js) -->
  <script async="" src="https://www.googletagmanager.com/gtag/js?id=GT-TQT5V342"></script>
  <script src="gtag_boot.js" defer=""></script>
  <script src="consent_banner.js" defer=""></script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Oons — women-first home services for Greater Cairo.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Oons">
  <meta name="theme-color" content="#4A3048">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Home | Oons</title>
  <link rel="manifest" href="manifest.json">
  <script src="a2hs.js?v=6" defer=""></script>
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  
  
  <style id="splash-screen-style">
    html, body {
      height: 100%;
      margin: 0;
      background-color: #F7F3EC;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
    }
  </script>
</head>
<body>
  
  
  
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <style id="oons-flutter-viewport">
    flt-glass-pane, flutter-view {
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
  <script>
    // Break stuck Flutter SW reload loops from older deploys (once per session).
    (function () {
      var ua = navigator.userAgent || '';
      var iab = /FBAN|FBAV|FB_IAB|FBIOS|FB4A|Instagram|WhatsApp|TikTok|Bytedance/i.test(ua);

      function pinFlutterViewport() {
        var css = document.getElementById('oons-flutter-viewport');
        if (css && css.parentNode) css.parentNode.appendChild(css);
        var injected = document.getElementById('oons-ios-store-style');
        if (injected && injected.textContent && /flt-glass-pane|flutter-view/.test(injected.textContent)) {
          injected.textContent = injected.textContent
            .replace(/html\.oons-has-ios-store[^{]*\{[^}]*\}/g, '')
            .replace(/html\.oons-has-ios-store flt-glass-pane[^}]*\}/g, '');
        }
        try { document.documentElement.classList.remove('oons-has-ios-store'); } catch (_) {}
      }
      try { removeSplashFromWeb(); } catch (_) {}
      pinFlutterViewport();
      var n = 0;
      var t = setInterval(function () {
        pinFlutterViewport();
        if (++n > 20) clearInterval(t);
      }, 250);

      if (!('serviceWorker' in navigator)) return;
      var KEY = 'oons_sw_cleared_v2';
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }).then(function () {
        if (window.caches && caches.keys) {
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        }
      }).then(function () {
        // Facebook IAB can wipe sessionStorage on reload — a reload loop
        // freezes the splash and burns paid traffic. Clear the SW, don't reload.
        if (iab) return;
        try {
          if (navigator.serviceWorker.controller && !sessionStorage.getItem(KEY)) {
            sessionStorage.setItem(KEY, '1');
            location.reload();
          }
        } catch (_) {}
      }).catch(function () {});
    })();
  </script>


</body></html>
